services:
  - type: web
    name: inventory-management-system
    env: python
    pythonVersion: 3.12
    plan: free
    branch: main
    buildCommand: chmod +x ./build.sh && pip install -r backend/requirements.txt && ./build.sh
    startCommand: cd backend && gunicorn inventory_system.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: inventory_system.settings_production
      - key: RENDER
        value: "true"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        value: "django-insecure-render-postgres-key-12345"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,*.render.com,127.0.0.1,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,https://*.render.com,http://localhost:8000,http://127.0.0.1:8000"

databases:
  - name: inventory-db
    databaseName: inventory_db
    user: inventory_user
    plan: free

# For a managed Render PostgreSQL database, set these values in the service environment or use the Render dashboard secrets.


