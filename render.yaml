services:
  - type: web
    name: inventory-management-system
    env: python
    pythonVersion: 3.12
    plan: free
    branch: main
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: cd backend && python -c "import os; print(f'DB_HOST: {os.environ.get(\"DB_HOST\", \"NOT SET\")}'); print(f'RENDER_DB_HOST: {os.environ.get(\"RENDER_DB_HOST\", \"NOT SET\")}');" && python manage.py migrate --noinput --verbosity 2 && gunicorn -w 2 -b 0.0.0.0:$PORT inventory_system.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: inventory_system.settings_production
      - key: RENDER
        value: "true"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        value: "django-insecure-render-postgres-key-12345"
      - key: ALLOWED_HOSTS
        value: "*.render.com,127.0.0.1,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.render.com,http://localhost:8000"

databases:
  - name: inventory-db
    databaseName: inventory_db
    user: inventory_user
    plan: free

# For a managed Render PostgreSQL database, set these values in the service environment or use the Render dashboard secrets.


